  title_voice_note: |
    Picked `Enforcement Hooks` (Title Case) over `enforcement-hooks`
    (slug form) and over `Lock Step` (metaphor form).

    The lowercase-hyphenated form is the package-name convention used
    by memory-pkg and sylphie-pkg, and it works there because those
    articles are literally about packages with those names. This
    article isn't naming a package — `enforcement-hooks` is just the
    slug the user picked. The article's own register refers to "this
    hook system," "the review hooks," "two gates." Using the slug as
    a visible title would imply a package that doesn't exist and
    over-claim the artifact's scope.

    Title Case `Enforcement Hooks` follows the precedent set by
    `Sylphie` (proper noun, concept-level title) rather than the
    package-name precedent. It signals "this is a system, not a
    package," matches the article's own language, and keeps the word
    `hooks` in the title so a reader skimming the index card sees
    what surface it lives on (Claude Code hook lifecycle).

    `Lock Step` was the prettier headline — it picks up the article's
    central metaphor and would read well in isolation — but on an
    index card flanked by three sibling cards, the reader benefits
    more from the concrete handle than the metaphor. Save the
    lock-step line for the body, where it's already doing real work.

