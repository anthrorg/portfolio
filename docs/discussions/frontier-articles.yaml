# ─────────────────────────────────────────────────────────────────────────────
# Sylphie alignment pass — append Why it matters + Code map
# ─────────────────────────────────────────────────────────────────────────────
sylphie_alignment:
  generated_at: "2026-05-12"
  rationale: |
    `sylphie.mdx` predates the two newer case studies and lacks their
    closing rhythm — a short thesis-crystallizing paragraph followed by
    a Code map reference table. Adding both lands Sylphie in the same
    family-of-articles shape without restructuring the body. The
    article's own opener already committed to a metric ("the share of
    decisions made without calling a language model"); the closing
    paragraph circles back to that metric in human terms — what it
    means for a reader rather than for the system — so the page ends
    where the page started. The Code map mirrors memory-pkg / sylphie-pkg
    in column shape, dropping the `Repo` column (every row is `sylphie`,
    which would add zero signal) and surfacing the architectural beats
    a reader of this article actually wants to find on disk: drive
    isolation, the cognitive-cycle steps with measurable triggers, the
    tensor sidecar, the four-graph memory layout, pathology detectors,
    Theater Prohibition machinery, the event bus.

    File-path policy: the Sylphie tech spec gives explicit workspace
    package names (`@sylphie/decision-making`, `@sylphie/drive-engine`,
    `@sylphie/communication`, etc.) and explicit container layout
    (`apps/sylphie`, `apps/drive-server`, the Python `cognition`
    sidecar), but does NOT give file paths inside those packages for
    individual subsystems. Rather than fabricate plausible-looking
    paths, I've kept package-level paths where the spec licenses them
    and marked any deeper path with a `?` suffix. The developer should
    treat `?`-marked rows as honest placeholders to verify against the
    real Sylphie repo — not as guesses to refine into a different guess.

  why_it_matters_mdx: |
    ## Why it matters

    Most agent products are LLM wrappers that get smarter by switching to a bigger LLM. Sylphie is built so the LLM is the scaffolding, not the load-bearing structure — drives, predictions, evaluations, and graduated procedures are the load-bearing structure. The metric the system reports on itself is **the share of decisions made without calling a language model**, and it is supposed to climb. Today it climbs slowly because most paths still route through deliberation; the architecture is what makes "slowly, then faster, then mostly not at all" a coherent trajectory rather than a slogan.

    The shorter version: an agent that watches itself, predicts the consequences of its own actions, measures how wrong those predictions were, and can only graduate a behavior after the measurement says it earned it — that's a different category of system than one that prompts a frontier model harder. This page is the architectural commitments that make the difference real.

  code_map_mdx: |
    ## Code map

    | Component | Path |
    |---|---|
    | Main backend (NestJS) | `apps/sylphie/` |
    | Drive engine (isolated process) | `apps/drive-server/` |
    | Drive rules table + RLS policy | `apps/drive-server/src/db/drive_rules.sql`? |
    | Drive engine package | `@sylphie/drive-engine` |
    | Decision-making package (Cortex) | `@sylphie/decision-making` |
    | Dual-process arbitration (Type 1 / Type 2 / SHRUG) | `@sylphie/decision-making/src/arbitration/`? |
    | Predict step (expected drive deltas) | `@sylphie/decision-making/src/predict/`? |
    | Evaluate step (MAE computation) | `@sylphie/decision-making/src/evaluate/`? |
    | Working memory selector (5-signal activation) | `@sylphie/decision-making/src/working-memory/`? |
    | Episodic memory ring buffer | `@sylphie/decision-making/src/episodic/`? |
    | Pathology detectors (5 attractors) | `@sylphie/decision-making/src/attractors/`? |
    | Tensor cognition sidecar (Python FastAPI) | `services/cognition/` (port 8431)? |
    | Learning package (consolidation, reflection) | `@sylphie/learning` |
    | Planning package (opportunity → procedure) | `@sylphie/planning` |
    | Communication package | `@sylphie/communication` |
    | Supervisor (DeepSeek meta-evaluator) | `@sylphie/supervisor` |
    | World Knowledge Graph (WKG) | Neo4j `bolt://localhost:7687` |
    | Self Knowledge Graph (SKG) | Neo4j `bolt://localhost:7690` |
    | Other Knowledge Graph (OKG) | Neo4j `bolt://localhost:7689` |
    | Codebase-as-graph (PKG) | Neo4j `bolt://localhost:7691` (see [sylphie-pkg](/work/sylphie-pkg)) |
    | Event bus types + boundary map | `@sylphie/events/src/EVENT_BOUNDARY_MAP.ts`? |
    | TimescaleDB events hypertable | postgres `timescaledb` port 5433, table `events` |
    | Postgres (auth, drive_rules) | postgres port 5434 |
    | Perception sidecar (YOLO + MediaPipe + Moondream2) | `services/perception/` (port 8430)? |
    | Frontend dashboard | `apps/frontend/`? (Vite + React 18 + Zustand + MUI) |
    | Inner Monologue panel (verbatim event reader) | `apps/frontend/src/routes/dashboard/inner-monologue/`? |

  mdx_notes:
    - "Append both sections to the end of sylphie.mdx, in the order: Why it matters, then Code map (matching the order in memory-pkg and sylphie-pkg)."
    - "No other edits to sylphie.mdx. Existing sections stay verbatim — the existing `## What is honestly not yet real` section stays in place directly above the new `## Why it matters` section."
    - "Any path marked with `?` is an inference from the article body or package name, not a path the tech spec actually gives. Developer should not 'fix' those by guessing further; they should be left as-is until verified against the real Sylphie repo. The `?` is part of the editorial honesty of this case — Sylphie's whole pitch is that it flags its own stubs and uncertainties rather than papering over them."
    - "The `Repo` column from memory-pkg / sylphie-pkg is intentionally dropped — every row here would read `sylphie` and add no signal."
    - "Bolt URLs are the dev-mode ports from the tech spec's container table (§2). These are real, not inferred; no `?` suffix."
    - "The cross-link to /work/sylphie-pkg in the PKG row is the only outbound link in the table and matches the pattern memory-pkg and sylphie-pkg use to cross-reference each other."

  developer_questions:
    - id: code-map-path-verification
      note: |
        Eleven of the rows in the Code map are marked with `?` because
        the tech spec doesn't ground them to a file path. If you have
        repo-level visibility into the real Sylphie source tree (the
        portfolio repo doesn't), it would be worth a single verification
        pass to turn `?` rows into confirmed paths. Don't guess —
        leaving `?` is the right call until the path is checked. The
        `?` rows are: drive rules SQL, arbitration module, predict
        step, evaluate step, working memory, episodic memory,
        attractors, cognition sidecar, perception sidecar, event
        boundary map, frontend root, and inner monologue route.

    - id: closing-paragraph-length
      note: |
        Drafted at two short paragraphs (~110 words) rather than the
        tighter single-paragraph close used by memory-pkg and
        sylphie-pkg. Sylphie's body is longer and more
        architecturally-loaded than the two package articles, and a
        single-sentence reframing felt like it would shrink-wrap the
        thesis. If the user prefers a single-paragraph close to match
        the cousins more strictly, the second paragraph can be cut
        cleanly without rewriting the first.

