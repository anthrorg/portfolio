<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..700&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <title>OG Source — Jim Tisdale</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --ink: #e4e4e7;
        --ink-muted: #a1a1aa;
        --grad-start: #4ba7f8;
        --grad-end: #8266f6;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        padding: 80px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .grain {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(75, 167, 248, 0.16),
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(130, 102, 246, 0.16),
            transparent 60%
          );
        pointer-events: none;
      }
      .brand {
        font-family: "Fraunces", serif;
        font-size: 36px;
        letter-spacing: -0.025em;
        z-index: 1;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 400;
        font-size: 88px;
        line-height: 1.05;
        letter-spacing: -0.025em;
        margin: 0;
        max-width: 900px;
        z-index: 1;
      }
      .grad {
        background: linear-gradient(90deg, var(--grad-start), var(--grad-end));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-style: italic;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 1;
      }
      .footer .url {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        color: var(--ink-muted);
      }
      .footer .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grain"></div>
      <div class="brand">Jim Tisdale</div>
      <h1>
        Harnessing AI agents to ship production software,
        <span class="grad">predictably</span>.
      </h1>
      <div class="footer">
        <span class="eyebrow">Agent Engineer</span>
        <span class="url">author.sylphie.live</span>
      </div>
    </div>
  </body>
</html>
